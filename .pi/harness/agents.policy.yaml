# Generated/maintained SSOT for harness agent tools (see ADR 0049).
# Regenerate hints: node .pi/scripts/generate-agents-policy-yaml.mjs

apiVersion: harness.toolkit/v1
kinds:
  planner:
    tools:
      - read
      - grep
      - find
      - ls
      - ctx_read
      - ctx_search
      - ctx_execute
      - ctx_batch_execute
      - ctx_tree
    extensions: false
    read_only: true
  executor:
    tools:
      - read
      - write
      - edit
      - bash
      - ls
    # Subprocess bundle (governance + anchored read/edit + lens) — not full .pi/extensions (parent phase hooks).
    extension_bundle: executor
    extensions: false
    read_only: false
  evaluator:
    tools:
      - read
      - grep
      - find
      - ls
      - ctx_read
      - ctx_search
      - ctx_execute
      - ctx_batch_execute
      - ctx_tree
    extensions: false
    read_only: true
  adversary:
    tools:
      - read
      - grep
      - find
      - ls
      - ctx_read
      - ctx_search
      - ctx_execute
      - ctx_batch_execute
      - ctx_tree
    extensions: false
    read_only: true
  tie_breaker:
    tools:
      - read
      - grep
      - find
      - ls
      - ctx_read
      - ctx_search
      - ctx_execute
      - ctx_batch_execute
      - ctx_tree
    extensions: false
    read_only: true
  trace:
    tools:
      - read
      - grep
      - find
      - ls
      - ctx_read
      - ctx_search
      - ctx_execute
      - ctx_batch_execute
      - ctx_tree
    extensions: false
    read_only: true
  incident:
    tools:
      - read
      - grep
      - find
      - ls
      - ctx_read
      - ctx_search
      - ctx_execute
      - ctx_batch_execute
      - ctx_tree
    extensions: false
    read_only: true
  other:
    tools:
      - read
      - grep
      - find
      - ls
      - ctx_read
      - ctx_search
      - ctx_execute
      - ctx_tree
    extensions: false
    read_only: true
agents:
  harness/incident-recorder:
    kind: incident
    tools_add:
      - submit_human_required
    extensions: false
    max_turns: 15
    thinking: medium
    submit_tool: submit_human_required
  harness/sentrux-bootstrap:
    kind: planner
    tools_add:
      - bash
    extensions: true
    max_turns: 12
    thinking: low
  harness/sentrux-steward:
    kind: planner
    tools_add:
      - bash
      - submit_sentrux_manifest_proposal
    extensions: false
    max_turns: 16
    thinking: high
    submit_tool: submit_sentrux_manifest_proposal
  harness/ls-lint-steward:
    kind: planner
    tools_add:
      - bash
      - submit_ls_lint_manifest_proposal
    extensions: false
    max_turns: 16
    thinking: high
    submit_tool: submit_ls_lint_manifest_proposal
  harness/trace-librarian:
    kind: trace
    tools_add:
      - submit_human_required
    extensions: false
    max_turns: 20
    thinking: medium
    submit_tool: submit_human_required
  harness/running/executor:
    kind: executor
    tools_add:
      - submit_executor_handoff
    max_turns: 20
    thinking: medium
    submit_tool: submit_executor_handoff
  harness/reviewing/adversary:
    kind: adversary
    tools_add:
      - submit_adversary_report
    extensions: false
    max_turns: 20
    thinking: high
    submit_tool: submit_adversary_report
  harness/reviewing/evaluator:
